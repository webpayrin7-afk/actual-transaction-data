name: Sync MOLIT warehouse

on:
  schedule:
    # 국토부 OpenAPI는 일 1회 갱신(시각 비공시).
    # 06:00~14:45 KST 15분 sentinel probe + 하루 2회 rolling 강제 sync
    # (06:00 / 18:00 KST). 23:00 KST는 probe 기반(당월 변화 시에만 full sync).
    # 당월 probe만으로는 과거 계약월 late-report를 놓친다.
    # 정책: src/lib/molit/sync-policy.ts
    # KST = UTC+9
    - cron: "*/15 21-23 * * *" # 06:00~08:45 KST
    - cron: "*/15 0-5 * * *" # 09:00~14:45 KST
    # 오후 추가 유입: 18:00 강제 rolling, 23:00는 probe only
    - cron: "0 9 * * *" # 18:00 KST forced
    - cron: "0 14 * * *" # 23:00 KST probe (not forced)
  workflow_dispatch:
    inputs:
      scope:
        description: "featured | anyang | all"
        required: false
        default: "all"
      trade_months:
        description: "매매 적재 개월 수 (late-report 커버, 기본 4)"
        required: false
        default: "4"
      rent_months:
        description: "전월세 적재 개월 수 (매매와 달리 2 유지)"
        required: false
        default: "2"
      force:
        description: "probe 무시하고 강제 sync (true/false)"
        required: false
        default: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Decide force window
        id: window
        run: |
          UTC_HOUR=$(date -u +%H)
          UTC_MIN=$(date -u +%M)
          FORCE=false
          # Keep in sync with src/lib/molit/sync-policy.ts isForcedRollingSchedule
          # workflow_dispatch force 입력
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force || 'true' }}" != "false" ]; then
            FORCE=true
          fi
          # Dedicated 18:00 KST cron — match the schedule string so runner delay cannot drop force
          if [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then FORCE=true; fi
          # 23:00 KST (0 14 * * *) stays probe-based — do not force
          # 06:00 KST = 21:00 UTC tick of the 15-min probe cron (grace: first 15 min)
          if [ "$UTC_HOUR" = "21" ] && [ "$UTC_MIN" -lt 15 ]; then FORCE=true; fi
          # 청약홈 사본은 하루 1회, sync 여부와 무관하게 06:00 KST 틱에서만.
          APPLYHOME=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$UTC_HOUR" = "21" ] && [ "$UTC_MIN" -lt 15 ]; then
            APPLYHOME=true
          fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "applyhome=$APPLYHOME" >> "$GITHUB_OUTPUT"
          echo "utc=${UTC_HOUR}:${UTC_MIN} force=$FORCE applyhome=$APPLYHOME"

      - name: Probe MOLIT freshness
        id: probe
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          ARGS=(--github-output)
          if [ "${{ steps.window.outputs.force }}" = "true" ]; then
            ARGS+=(--force=1)
          fi
          npx tsx scripts/probe-molit-freshness.ts "${ARGS[@]}"

      - name: Sync warehouse when stale
        if: steps.probe.outputs.should_sync == 'true'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MOLIT_SYNCING: "1"
        run: |
          SCOPE="${{ github.event.inputs.scope || 'all' }}"
          TRADE="${{ github.event.inputs.trade_months || '4' }}"
          RENT="${{ github.event.inputs.rent_months || '2' }}"
          # 스케줄: 매매 4개월(당월+직전 3) rolling. 전월세는 2개월 유지.
          # 실제 transaction WRITE는 dirty-check 변경분만.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCOPE=all
            TRADE=4
            RENT=2
          fi
          echo "probe summary: ${{ steps.probe.outputs.summary }}"
          # 변경된 월만 DB에 기록 (Turso write 절약)
          npx tsx scripts/sync-molit.ts \
            --scope="$SCOPE" \
            --trade-months="$TRADE" \
            --rent-months="$RENT" \
            --concurrency=2 \
            --skip-existing=0 \
            --only-changed=1

      # 동기화가 실제로 끝난 뒤에만. 15분 probe로 sync가 건너뛴 틱에서는 돌리지 않는다.
      # days=2: 오늘·어제 확인분. INSERT OR IGNORE 라 같은 범위 재실행은 inserted 0.
      # 하루 확인 매매가 2만 건을 넘으면 스크립트가 대량 적재일로 보고 그 날은 건너뛴다.
      - name: Record new highs and drops after sync
        if: steps.probe.outputs.should_sync == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run db:price-moves -- --days=2 --apply

      - name: Skip sync (already fresh)
        if: steps.probe.outputs.should_sync != 'true'
        run: echo "Warehouse already matches MOLIT probe sentinels — skip sync."

      # 하루 1회. MOLIT sync 가 돌았는지와 무관하고, KST 06:00 틱(UTC 21:00, 15분 유예)에서만.
      # 바뀐 applyhome_* 행만 upsert. 같은 명령을 --apply 없이 다시 돌리면 insert 0 / update 0.
      - name: Refresh Applyhome copy
        if: (success() || failure()) && steps.window.outputs.applyhome == 'true'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/applyhome/sync-applyhome.ts --apply
