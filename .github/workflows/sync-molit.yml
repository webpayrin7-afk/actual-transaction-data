name: Sync MOLIT warehouse

on:
  schedule:
    # 매일 08:00 KST (23:00 UTC) — 전일 실거래 반영
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "featured | anyang | all"
        required: false
        default: "featured"
      trade_months:
        description: "매매 적재 개월 수"
        required: false
        default: "120"
      rent_months:
        description: "전월세 적재 개월 수"
        required: false
        default: "48"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Sync warehouse
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MOLIT_SYNCING: "1"
        run: |
          SCOPE="${{ github.event.inputs.scope || 'all' }}"
          TRADE="${{ github.event.inputs.trade_months || '120' }}"
          RENT="${{ github.event.inputs.rent_months || '48' }}"
          # 스케줄 실행: 전체 지역 최근 3개월만 갱신 (이미 있는 월은 스크립트에서 스킵 가능하나
          # 최신월은 국토부 데이터가 매일 갱신되므로 skip-existing=0 으로 덮어씀)
          SKIP_EXISTING=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCOPE=all
            TRADE=3
            RENT=3
            SKIP_EXISTING=0
          fi
          npx tsx scripts/sync-molit.ts \
            --scope="$SCOPE" \
            --trade-months="$TRADE" \
            --rent-months="$RENT" \
            --concurrency=3 \
            --skip-existing="$SKIP_EXISTING"
