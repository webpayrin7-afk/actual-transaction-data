name: Sync MOLIT warehouse

on:
  schedule:
    # 국토부 OpenAPI는 일 1회 갱신(시각 비공시). 08:00 고정 적재가 아니라
    # 06:00~14:45 KST 15분 probe + 하루 수회 rolling 강제 sync.
    # late-report(수개월 전 계약의 당일 공개)를 놓치지 않으려면
    # 당월 sentinel만으로 skip하면 안 되므로 아침 1회는 강제한다.
    # KST = UTC+9
    - cron: "*/15 21-23 * * *" # 06:00~08:45 KST
    - cron: "*/15 0-5 * * *" # 09:00~14:45 KST
    # 오후·야간 추가 유입 대비 강제 갱신
    - cron: "0 9 * * *" # 18:00 KST
    - cron: "0 14 * * *" # 23:00 KST
  workflow_dispatch:
    inputs:
      scope:
        description: "featured | anyang | all"
        required: false
        default: "all"
      trade_months:
        description: "매매 적재 개월 수 (late-report 커버, 기본 4)"
        required: false
        default: "4"
      rent_months:
        description: "전월세 적재 개월 수 (매매와 달리 2 유지)"
        required: false
        default: "2"
      force:
        description: "probe 무시하고 강제 sync (true/false)"
        required: false
        default: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Decide force window
        id: window
        run: |
          UTC_HOUR=$(date -u +%H)
          UTC_MIN=$(date -u +%M)
          FORCE=false
          # workflow_dispatch force 입력
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force || 'true' }}" != "false" ]; then
            FORCE=true
          fi
          # 06:00 KST(21 UTC) 아침 rolling 1회 강제 — late-report는 당월 probe에 안 잡힘
          if [ "$UTC_HOUR" = "21" ] && [ "$UTC_MIN" = "00" ]; then FORCE=true; fi
          # 18:00 KST(09 UTC) · 23:00 KST(14 UTC) 정각도 강제
          if [ "$UTC_HOUR" = "09" ] && [ "$UTC_MIN" = "00" ]; then FORCE=true; fi
          if [ "$UTC_HOUR" = "14" ] && [ "$UTC_MIN" = "00" ]; then FORCE=true; fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "utc=${UTC_HOUR}:${UTC_MIN} force=$FORCE"

      - name: Probe MOLIT freshness
        id: probe
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          ARGS=(--github-output)
          if [ "${{ steps.window.outputs.force }}" = "true" ]; then
            ARGS+=(--force=1)
          fi
          npx tsx scripts/probe-molit-freshness.ts "${ARGS[@]}"

      - name: Sync warehouse when stale
        if: steps.probe.outputs.should_sync == 'true'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MOLIT_SYNCING: "1"
        run: |
          SCOPE="${{ github.event.inputs.scope || 'all' }}"
          TRADE="${{ github.event.inputs.trade_months || '4' }}"
          RENT="${{ github.event.inputs.rent_months || '2' }}"
          # 스케줄: 매매 4개월(당월+직전 3) rolling. 전월세는 2개월 유지.
          # 실제 transaction WRITE는 dirty-check 변경분만.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCOPE=all
            TRADE=4
            RENT=2
          fi
          echo "probe summary: ${{ steps.probe.outputs.summary }}"
          # 변경된 월만 DB에 기록 (Turso write 절약)
          npx tsx scripts/sync-molit.ts \
            --scope="$SCOPE" \
            --trade-months="$TRADE" \
            --rent-months="$RENT" \
            --concurrency=2 \
            --skip-existing=0 \
            --only-changed=1

      - name: Skip sync (already fresh)
        if: steps.probe.outputs.should_sync != 'true'
        run: echo "Warehouse already matches MOLIT probe sentinels — skip sync."
